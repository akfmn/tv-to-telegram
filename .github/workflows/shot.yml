name: TradingView screenshot

on:
  # Расписание задаёт Cloudflare Worker (telegram-worker/worker.js): он каждые
  # 10 минут дёргает этот workflow. Встроенное расписание GitHub отключено —
  # оно опаздывало на часы и пропускало запуски.
  workflow_dispatch:
    inputs:
      force:
        description: "true = отправить сейчас, игнорируя рабочие часы"
        default: "true"
      symbols:
        description: "Только эти инструменты через запятую (пусто = список из CHART_URL)"
        default: ""
  push:                       # тест без браузера: изменение файла .run-test
    paths: [".run-test"]

concurrency:
  group: tv-shot           # если /chart нажали несколько раз — запуски идут по очереди
  cancel-in-progress: false

permissions:
  contents: write             # нужно только для keepalive

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest already has Python 3 + pip, so no setup step is needed
      - name: Install
        run: pip install --quiet --disable-pip-version-check playwright requests

      - name: Screenshot -> Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHART_URL: ${{ secrets.CHART_URL }}
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          SYMBOL: ${{ vars.SYMBOL }}
          INTERVAL: ${{ vars.INTERVAL }}
          TZ_NAME: ${{ vars.TZ_NAME }}
          SEND_AS_FILE: ${{ vars.SEND_AS_FILE }}
          WORK_HOURS: ${{ vars.WORK_HOURS || '09:00-17:00' }}
          WORK_DAYS: ${{ vars.WORK_DAYS || '1-5' }}
          VIEW_HOURS: ${{ vars.VIEW_HOURS || '24' }}
          WATERMARK: ${{ vars.WATERMARK }}
          ALBUM: ${{ vars.ALBUM }}
          FORCE: ${{ github.event_name == 'push' || inputs.force == 'true' }}
          SYMBOLS_OVERRIDE: ${{ inputs.symbols }}
        run: python tv_shot.py

      # GitHub отключает расписание, если в репозитории 60 дней нет коммитов.
      # Раз в ~50 дней делаем пустой коммит, чтобы робот не уснул.
      - name: Keep alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
