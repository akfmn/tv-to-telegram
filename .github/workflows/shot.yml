name: TradingView screenshot

on:
  schedule:
    # Каждые 10 минут, пн–пт. Время в cron — UTC, поэтому берём запас под летнее
    # и зимнее время Израиля; точное окно 09:00–17:00 (Иерусалим) и дни
    # проверяет сам скрипт (WORK_HOURS, WORK_DAYS), лишние запуски ничего не шлют.
    - cron: "*/10 6-14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:          # кнопка "Run workflow" для ручного теста

permissions:
  contents: write             # нужно только для keepalive

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tv_shot.py

      - name: Install
        run: pip install playwright requests

      - name: Screenshot -> Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHART_URL: ${{ secrets.CHART_URL }}
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          SYMBOL: ${{ vars.SYMBOL }}
          INTERVAL: ${{ vars.INTERVAL }}
          TZ_NAME: ${{ vars.TZ_NAME }}
          SEND_AS_FILE: ${{ vars.SEND_AS_FILE }}
          WORK_HOURS: ${{ vars.WORK_HOURS || '09:00-17:00' }}
          WORK_DAYS: ${{ vars.WORK_DAYS || '1-5' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python tv_shot.py

      # GitHub отключает расписание, если в репозитории 60 дней нет коммитов.
      # Раз в ~50 дней делаем пустой коммит, чтобы робот не уснул.
      - name: Keep alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
